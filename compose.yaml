services:

  achievement_system:
    build: ./achievement-system
    ports:
      - 8000:80

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_DATABASE: achievement_system
      MARIADB_ROOT_PASSWORD: root
    ports:
      - 3306:3306

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080