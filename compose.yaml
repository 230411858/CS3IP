services:

  achievement_system:
    build: ./achievement-system
    image: hcwy/achievement-system:latest
    container_name: achievement-system
    restart: always
    environment:
      - ACHIEVEMENT_SYSTEM_LOCAL_IP=172.17.0.2
    ports:
      - 8000:80
    depends_on:
      db:
        condition: service_healthy
        restart: true
    post_start:
      - command: php artisan migrate:fresh --seed

  db:
    image: mariadb
    container_name: db
    restart: always
    environment:
      MARIADB_DATABASE: achievement_system
      MARIADB_ROOT_PASSWORD: root
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8001:8080